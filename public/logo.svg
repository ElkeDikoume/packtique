<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" fill="none">
  <!-- P stem (left vertical bar) -->
  <rect x="12" y="20" width="16" height="72" rx="5" fill="#C9A84C"/>

  <!-- Suitcase handle arc (sits above the suitcase body, connects to stem at left) -->
  <path d="M 28 46 Q 28 28 52 28 Q 76 28 76 46"
        stroke="#C9A84C" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- Suitcase body = P bowl -->
  <rect x="28" y="44" width="50" height="42" rx="10" fill="#C9A84C"/>

  <!-- Mid horizontal band on suitcase -->
  <rect x="28" y="62" width="50" height="6" rx="0" fill="#B8943A" opacity="0.55"/>

  <!-- Suitcase clasp housing -->
  <rect x="44" y="58" width="20" height="14" rx="5" fill="#B8943A" opacity="0.7"/>
  <!-- Clasp inner recess -->
  <rect x="48" y="62" width="12" height="6" rx="3" fill="rgba(27,45,79,0.3)"/>

  <!-- PACKTIQUE wordmark -->
  <text
    x="62" y="116"
    text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="900"
    font-size="11.5"
    letter-spacing="3.2"
    fill="#1B2D4F">PACKTIQUE</text>
</svg>
